batches:
  - isomer_instruction: "all" # This currently does nothing but in the future will be used to determine which isomers can be assembled
    max_num_complexes: 4
    total_charge: 0
    name: "2-2-1-1-monometalic"
    random_seed: 5
    geometry:
      - metal_1:
          metal_type: Ir
          metal_oxidation_state: 3
          origin: [ 0, 0, 0 ]
      - ligand_1:
          origin: [ 0, 0, 0 ]
          vector_1: [ 0, 0, 1 ]
          temp_dent: 1
          n_max: 30
          ligand_db: /Users/cianclarke/Documents/PhD/Complex_Assembly/DART/DART/dev/Assembler_revision_jan_2025/assembler/ligand_filtering/JSON/small_mono.json
      - ligand_2:
          origin: [ 0, 0, 0 ]
          vector_1: [ 0, 1, 0]
          temp_dent: 1
          n_max: 30
          ligand_db: /Users/cianclarke/Documents/PhD/Complex_Assembly/DART/DART/dev/Assembler_revision_jan_2025/assembler/ligand_filtering/JSON/small_mono.json
      - ligand_3:
          origin: [ 0, 0, 0 ]
          vector_1: [-1, 0, 0 ]
          vector_2: [ 0, -1, 0 ]
          temp_dent: 2
          n_max: 30
          ligand_db: /Users/cianclarke/Documents/PhD/Complex_Assembly/DART/DART/dev/Assembler_revision_jan_2025/assembler/ligand_filtering/JSON/bidentate_NN.json
      - ligand_4:
          origin: [ 0, 0, 0 ]
          vector_1: [ 1, 0, 0 ]
